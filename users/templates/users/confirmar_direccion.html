<!DOCTYPE html>
<html>
<head>
    <title>Confirmar Dirección</title>

    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: 'Lora', 'Georgia', serif;
            background: linear-gradient(135deg, #fffbe6 0%, #fff 60%, #f8e7c1 100%);
            color: #000;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 820px;
            margin: 60px auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 8px 32px 0 rgba(198,167,94,0.15), 0 1.5px 0 #C6A75E inset;
            padding: 24px 56px 16px 56px;
            width: 100%;
            max-width: 820px;
            position: relative;
        }
        h2 {
            text-align: center;
            color: #6E0E2E;
            margin-bottom: 24px;
            font-size: 32px;
            font-family: 'Playfair Display', 'Georgia', serif;
            font-weight: 700;
        }
        .gold-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #C6A75E 0%, #fff 100%);
            border-radius: 2px;
            margin: 0 auto 32px auto;
        }
        .direccion {
            text-align: center;
            font-size: 18px;
            margin-bottom: 18px;
            color: #6E0E2E;
        }
        .map-container {
            width: 100%;
            height: 350px;
            margin-bottom: 32px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px 0 #C6A75E22;
            background: #f8e7c1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }
        button {
            padding: 13px 40px;
            background: #000;
            color: #C6A75E;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Lora', serif;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 2px 8px 0 #C6A75E22;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
        }
        button:hover {
            background: #6E0E2E;
            color: #fff;
            box-shadow: 0 4px 16px 0 #6E0E2E33;
        }
        .edit-form {
            margin-top: 24px;
            display: none;
        }
        .edit-form.active {
            display: block;
        }
        .edit-form input {
            margin-bottom: 12px;
            width: 100%;
            padding: 10px;
            border: 1.5px solid #C6A75E;
            border-radius: 7px;
            font-size: 15px;
            font-family: 'Lora', serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .edit-form input:focus {
            border-color: #6E0E2E;
        }
        
        .back-arrow {
        position: absolute;
        top: 32px;
        left: 32px;
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #6E0E2E;
        font-size: 1.2rem;
        font-family: 'Lora', serif;
        font-weight: 600;
        transition: color 0.2s;
        z-index: 10;
    }
    .back-arrow:hover {
        color: #C6A75E;
    }
    .back-arrow svg {
        margin-right: 8px;
        width: 28px;
        height: 28px;
        fill: #6E0E2E;
        transition: fill 0.2s;
    }
    .back-arrow:hover svg {
        fill: #C6A75E;
    }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <a href="{% url 'registro' %}"class="back-arrow">
            <svg viewBox="0 0 24 24"><path d="M15.5 19.5L9 12l6.5-7.5" stroke="#6E0E2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            
        </a>
        <h2>Confirmá tu dirección</h2>
        <div class="gold-line"></div>
        <div class="direccion" id="direccion-text">
            {{ data.calle }} {{ data.numero }}, {{ data.ciudad }}, {{ data.provincia }}, Argentina
        </div>
        <div class="map-container" id="map-container">
            <div id="map" style="width: 100%; height: 100%;"></div>
        </div>
        <div class="button-group">
            <button type="button" id="editar-btn">Editar dirección</button>
            <form method="POST" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Confirmar ubicación</button>
            </form>
        </div>
        <form class="edit-form" id="edit-form">
            <input type="text" id="calle" name="calle" placeholder="Calle" value="{{ data.calle }}">
            <input type="text" id="numero" name="numero" placeholder="Número" value="{{ data.numero }}">
            <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" value="{{ data.ciudad }}">
            <input type="text" id="provincia" name="provincia" placeholder="Provincia" value="{{ data.provincia }}">
            <input type="text" id="codigo_postal" name="codigo_postal" placeholder="Código Postal" value="{{ data.codigo_postal }}">
            <button type="submit">Guardar cambios</button>
        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const address = "{{ data.calle }} {{ data.numero }}, {{ data.ciudad }}, {{ data.provincia }}, Argentina";
        // Mostrar el mapa apenas carga la página
        let map = L.map('map').setView([-34.92145, -57.95453], 16); // Coordenadas de ejemplo
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Leaflet | © OpenStreetMap contributors',
            detectRetina: true,
            reuseTiles: true,
            updateWhenIdle: true
        }).addTo(map);
        let marker = L.marker([-34.92145, -57.95453]).addTo(map);
        // Buscar la dirección y actualizar el marker
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    const lat = data[0].lat;
                    const lon = data[0].lon;
                    map.setView([lat, lon], 16);
                    marker.setLatLng([lat, lon]);
                }
            });
        // Lógica para editar dirección
        const editarBtn = document.getElementById('editar-btn');
        const editForm = document.getElementById('edit-form');
        editarBtn.addEventListener('click', function() {
            editForm.classList.toggle('active');
        });
        // Aquí puedes agregar lógica para actualizar el texto y el mapa según los cambios
    });
</script>

</body>
</html>
