{% extends 'users/dashboard_admin.html' %}
{% block content %}
<div class="editar-cliente-right">
    <div class="editar-cliente-card">
        <a href="{% url 'users:listado_clientes' %}" class="btn btn-light mb-3" style="font-size: 1.5rem; border: none; padding: 4px 16px 4px 10px;">
            &#8592;
        </a>
        <h2>Editar Cliente</h2>
        {% if mensaje %}
            <div class="alert {% if 'correctamente' in mensaje %}alert-success{% else %}alert-danger{% endif %} mt-3">{{ mensaje }}</div>
        {% endif %}
        <div class="mb-3 text-end">
            <a href="{% url 'users:agregar_direccion' cliente.id %}" class="btn btn-outline-secondary">+ Agregar dirección</a>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_nombre" class="form-label">Nombre completo</label>
                {{ form.nombre }}
            </div>
            <div class="mb-3">
                <label for="id_email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" value="{{ form.email.value }}" disabled>
            </div>
            <div class="mb-3">
                <label for="id_telefono" class="form-label">Teléfono</label>
                {{ form.telefono }}
            </div>
            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" value="{{ cliente.dni }}" disabled>
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </div>
        </div>
</div>
<style>
.editar-cliente-right {
    padding-top: 32px;
    padding-bottom: 32px;
    padding-left: 28vw;
    display: flex;
    justify-content: flex-start;
}
@media (max-width: 1100px) {
    .editar-cliente-right {
        padding-left: 10vw;
    }
}
@media (max-width: 900px) {
    .editar-cliente-right {
        padding-left: 0;
        justify-content: center;
    }
}
.editar-cliente-card {
    background: #fff;
    max-width: 500px;
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 4px 32px rgba(184,146,42,0.10);
    padding: 2.5rem 2rem 2rem 2rem;
    margin: 2.5rem auto;
}
.editar-cliente-card h2 {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 2.1rem;
    font-weight: 700;
    color: #2d3848;
    text-align: left;
    margin-bottom: 1.5rem;
    letter-spacing: 1px;
}
.editar-cliente-card label {
    font-weight: 600;
    color: #3b4252;
    margin-bottom: 0.3rem;
}
.editar-cliente-card .form-control[disabled] {
    background: #f8f5ef;
    color: #8c7e70;
    border: 1.5px solid #e8dfd4;
}
.editar-cliente-card .btn-primary {
    background: linear-gradient(90deg, #fbe18b 0%, #b8922a 100%);
    color: #6E0E2E;
    border: none;
    border-radius: 10px;
    padding: 0.85rem 2.5rem;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 2px 8px 0 rgba(184,146,42,0.10);
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, color 0.18s;
    text-transform: uppercase;
    margin-top: 1.5rem;
}
.editar-cliente-card .btn-primary:hover {
    background: linear-gradient(90deg, #b8922a 0%, #fbe18b 100%);
    color: #fff;
    box-shadow: 0 4px 16px 0 rgba(184,146,42,0.18);
}
.editar-cliente-card .btn-outline-secondary {
    border-radius: 8px;
    border: 1.5px solid #b8922a;
    color: #b8922a;
    font-weight: 600;
    background: #fffbe6;
    transition: background 0.18s, color 0.18s;
}
.editar-cliente-card .btn-outline-secondary:hover {
    background: #b8922a;
    color: #fff;
}
.editar-cliente-card .btn-light {
    background: #f8f5ef;
    color: #b8922a;
    border-radius: 8px;
    border: none;
    font-size: 1.5rem;
    padding: 4px 16px 4px 10px;
    margin-bottom: 1.2rem;
}
.editar-cliente-card .btn-light:hover {
    background: #b8922a;
    color: #fff;
}
@media (max-width: 900px) {
    .editar-cliente-card {
        padding: 1.2rem 0.5rem 1.5rem 0.5rem;
        max-width: 98vw;
    }
}
</style>
{% endblock %}
