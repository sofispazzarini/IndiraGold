{% extends "users/base.html" %}
{% block content %}
<style>
    body {
        background: #f7f3ed;
    }
    .login-container {
        background: #fffaf4;
        border-radius: 22px;
        box-shadow: 0 4px 32px rgba(180, 140, 80, 0.08);
        padding: 48px 38px 38px 38px;
        max-width: 370px;
        margin: auto;
        margin-top: 10vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .login-title {
        color: #7c5a3a;
        font-family: 'Playfair Display', serif;
        font-size: 2.2rem;
        margin-bottom: 32px;
        font-weight: 600;
        letter-spacing: 1px;
    }
    .form-label {
        color: #7c5a3a;
        font-family: 'Playfair Display', serif;
        font-size: 1.08rem;
        font-weight: 500;
        margin-bottom: 6px;
    }
    .form-control {
        border: none;
        border-radius: 12px;
        font-size: 1.08rem;
        padding: 12px;
        margin-bottom: 22px;
        background: #f7f3ed;
        color: #3a2c1a;
        box-shadow: 0 1px 4px rgba(180, 140, 80, 0.07);
    }
    .form-control:focus {
        outline: 2px solid #d6b97b;
        background: #fff;
    }
    .btn-elegant {
        background: linear-gradient(90deg, #e7cfa2 60%, #d6b97b 100%);
        color: #3a2c1a;
        font-family: 'Playfair Display', serif;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        width: 100%;
        font-size: 1.12rem;
        padding: 13px 0;
        margin-top: 8px;
        box-shadow: 0 2px 8px rgba(180, 140, 80, 0.08);
        transition: background 0.2s;
    }
    .btn-elegant:hover {
        background: linear-gradient(90deg, #d6b97b 60%, #e7cfa2 100%);
        color: #7c5a3a;
    }
    .register-link {
        margin-top: 32px;
        color: #7c5a3a;
        font-size: 1.02rem;
        text-align: center;
        font-family: 'Playfair Display', serif;
    }
    .register-link a {
        color: #d6b97b;
        font-weight: 600;
        text-decoration: none;
        margin-left: 6px;
        font-family: 'Playfair Display', serif;
    }
    .register-link a:hover {
        text-decoration: underline;
        color: #e7cfa2;
    }
    .error-message {
        color: #7c5a3a;
        background: #f7e6e6;
        border-radius: 8px;
        padding: 10px 0;
        margin-top: 20px;
        text-align: center;
        font-weight: 500;
        font-family: 'Playfair Display', serif;
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<div class="login-container">
    <div class="login-title">Iniciar sesión</div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">DNI:</label>
                <input type="text" class="form-control" id="username" name="username" required pattern="\d{7,8}" maxlength="8" title="Ingrese solo números (7 u 8 dígitos)">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            {% if error %}
                <div class="alert alert-danger mt-2">{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>
    <div class="register-link">
        ¿No tienes cuenta?
        <a href="{% url 'registro' %}">Regístrate</a>
    </div>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
</div>
{% endblock %}
