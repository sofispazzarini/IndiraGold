{% extends 'basico.html' %}

{% block content %}
<style>

.login-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

.login-card{
    width:420px;
    background:white;
    border-radius:18px;
    padding:45px 40px;
    border:1px solid #e8dfd4;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.login-title{
    font-family:'Cormorant Garamond',serif;
    font-size:2.4rem;
    text-align:center;
    margin-bottom:30px;
    color:#1a1612;
}

.form-group{
    margin-bottom:20px;
}

.form-label{
    font-size:.85rem;
    font-weight:500;
    color:#8c7e70;
    margin-bottom:6px;
    display:block;
}

.form-control{
    width:100%;
    padding:12px 14px;
    border:1px solid #e8dfd4;
    border-radius:10px;
    font-size:.95rem;
    background:#faf7f4;
    box-sizing:border-box;
}

.form-control:focus{
    outline:none;
    border-color:#b8922a;
    background:white;
    box-shadow:0 0 0 2px rgba(184,146,42,.15);
}

.btn-login{
    width:100%;
    padding:12px 14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;

    background:linear-gradient(135deg,#7c2a3a,#b8922a);
    color:white;

    box-sizing:border-box;
}

.btn-login:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 20px rgba(0,0,0,.12);
}

.register-link{
    text-align:center;
    margin-top:25px;
    font-size:.9rem;
    color:#8c7e70;
}

.register-link a{
    color:#b8922a;
    text-decoration:none;
    font-weight:600;
}

.register-link a:hover{
    color:#7c2a3a;
}

.alert{
    background:#fff3f3;
    border:1px solid #f1caca;
    color:#7c2a3a;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
    font-size:.85rem;
}

</style>

<div class="login-wrapper">

<div class="login-card">
<div style="text-align:center;margin-bottom:10px;
font-family:'Cormorant Garamond';font-size:1.4rem;color:#b8922a;font-weight:700;">
IndiraGold
</div>
<div class="login-title">
Iniciar sesión
</div>

<form method="post">
{% csrf_token %}

{% if error %}
<div class="alert">{{ error }}</div>
{% endif %}

<div class="form-group">
<label class="form-label">Nombre de usuario</label>
<input type="text"
class="form-control"
name="username"
required
pattern="\d{7,8}"
maxlength="8">
</div>

<div class="form-group">
<label class="form-label">Contraseña</label>
<input type="password"
class="form-control"
name="password"
required>
</div>

<button type="submit" class="btn-login">
Iniciar sesión
</button>

</form>

<div class="register-link">
¿No tienes cuenta?
<a href="{% url 'users:registro' %}">
Regístrate
</a>
</div>

</div>
</div>

{% endblock %}
