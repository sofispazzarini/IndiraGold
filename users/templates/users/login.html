{% extends 'basico.html' %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #b8922a;
    --gold-faint: #faf7f0;
    --burgundy: #6E0E2E;
    --dark: #1a1612;
    --text: #3d342a;
    --muted: #9c8c7c;
    --border: #e8dfd4;
  }

  .login-wrapper {
    width: 100%;
    padding: 1rem;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    padding: 3.5rem 3rem;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.06);
    position: relative;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: var(--burgundy);
    border-radius: 0 0 3px 3px;
  }

  .brand {
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--burgundy);
    letter-spacing: 0.05em;
  }

  .login-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 600;
    text-align: center;
    color: var(--dark);
    margin-bottom: 2.5rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .form-input {
    width: 100%;
    padding: 0.9rem 1rem;
    border: none;
    border-bottom: 1.5px solid var(--border);
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    color: var(--dark);
    background: transparent;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }

  .form-input:focus {
    outline: none;
    border-bottom-color: var(--burgundy);
  }

  .form-input::placeholder {
    color: #ccc;
  }

  .alert-error {
    background: rgba(110, 14, 46, 0.06);
    border: 1px solid rgba(110, 14, 46, 0.15);
    color: var(--burgundy);
    padding: 0.9rem 1.2rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    text-align: center;
    font-size: 0.85rem;
  }

  .btn-login {
    width: 100%;
    padding: 1rem;
    margin-top: 1rem;
    border: none;
    border-radius: 50px;
    background: var(--dark);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .btn-login:hover {
    background: var(--burgundy);
    transform: translateY(-2px);
  }

  .register-link {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .register-link a {
    color: var(--burgundy);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }

  .register-link a:hover {
    color: var(--dark);
  }

  @media (max-width: 480px) {
    .login-wrapper {
      padding: 0.5rem;
    }
    .login-card {
      padding: 2.5rem 1.5rem;
      border-radius: 16px;
    }
    .login-title {
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    .form-input {
      padding: 0.75rem 0.5rem;
    }
  }
</style>

<div class="login-wrapper">
  <div class="login-card">

    <div class="brand">
      <span class="brand-name">Indira Gold</span>
    </div>

    <h1 class="login-title">Iniciar sesión</h1>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">DNI (Usuario)</label>
        <input type="text"
               class="form-input"
               name="username"
               placeholder="Ingresá tu DNI"
               required
               pattern="\d{7,8}"
               maxlength="8">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password"
               class="form-input"
               name="password"
               placeholder="Tu contraseña"
               required>
      </div>

      <button type="submit" class="btn-login">
        INGRESAR
      </button>
    </form>

    <p class="register-link">
      ¿No tenés cuenta? <a href="{% url 'users:registro' %}">Registrate</a>
    </p>

  </div>
</div>
{% endblock %}
