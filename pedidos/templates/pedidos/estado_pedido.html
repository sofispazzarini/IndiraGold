{% extends 'users/dashboard_cliente.html' %}

{% block content %}

<div class="container py-5">

    <div class="mx-auto" style="max-width:900px;">

        <div class="card border-0 shadow-lg rounded-5 p-5">

            <div class="text-center mb-5">

                <h1 class="fw-bold text-luxury">
                    Estado de tu pedido
                </h1>

                <p class="text-muted">
                    Pedido #{{ pedido.id }}
                </p>

            </div>

            <div class="timeline">

                {% for paso in pasos %}

                    <div class="timeline-item">

                        <div class="
                            timeline-icon

                            {% if paso.completado %}
                                completed
                            {% elif paso.actual %}
                                active
                            {% endif %}
                        ">
                            {% if paso.completado %}
                                ✓
                            {% elif paso.actual %}
                                ●
                            {% endif %}
                        </div>

                        <div class="timeline-content">

                            <h5 class="fw-bold mb-1">
                                {{ paso.nombre }}
                            </h5>

                            <p class="text-muted mb-0">
                                {{ paso.descripcion }}
                            </p>

                        </div>

                    </div>

                {% endfor %}

            </div>

        </div>

    </div>

</div>

<style>

.timeline{
    position:relative;
    margin-left:20px;
}

.timeline::before{
    content:'';
    position:absolute;
    left:19px;
    top:0;
    width:3px;
    height:100%;
    background:#e9e9e9;
}

.timeline-item{
    display:flex;
    align-items:flex-start;
    margin-bottom:40px;
    position:relative;
}

.timeline-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ddd;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    z-index:2;
    flex-shrink:0;
}

.timeline-icon.completed{
    background:#28a745;
}

.timeline-icon.active{
    background:#d4af37;
    box-shadow:0 0 0 8px rgba(212,175,55,.15);
}

.timeline-content{
    margin-left:20px;
    padding-top:5px;
}

.text-luxury{
    color:#1f1f1f;
}

</style>

{% endblock %}
