<div class="modal fade" id="modalVariante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: 15px; border: none; shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <div class="modal-header" style="background: #1a1612; color: #b8922a; border-radius: 15px 15px 0 0;">
        <h5 class="modal-title">Nueva Variante de Stock</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formVarianteInternal">
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">TALLE (opcional)</label>
            <input type="text" class="form-control" id="inputTalleLibre" placeholder="Ej: S, M, XL, 42, Unico... o dejalo vacio"
                   style="border-radius: 8px; border: 1.5px solid #e8dfd4;">
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">STOCK DE ESTA VARIANTE</label>
            <input type="number" min="0" step="1" class="form-control" id="inputStockVariante" placeholder="Ej: 12" required
                   style="border-radius: 8px; border: 1.5px solid #e8dfd4;">
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">COLORES</label>
            <div class="input-group mb-2">
              <input type="color" class="form-control form-control-color" id="colorPickerModal" value="#000000" title="Elegir color" 
                     style="max-width: 50px; height: 38px; padding: 2px; border-radius: 8px 0 0 8px; cursor: pointer;">
              <input type="text" class="form-control" id="colorNombreModal" placeholder="Nombre (Ej: Azul Marino)" 
                     style="border-top: 1.5px solid #e8dfd4; border-bottom: 1.5px solid #e8dfd4; border-left: none;">
              <button type="button" class="btn btn-dark" id="btnPostColor" style="border-radius: 0 8px 8px 0;">+</button>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="colorNingunoModal">
              <label class="form-check-label small" for="colorNingunoModal">No aplica color</label>
            </div>
            
            <div id="displayColoresTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px;"></div>
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">MEDIDAS (cm)</label>
            <div class="row g-2 mb-2">
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAlto" placeholder="Alto"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAncho" placeholder="Ancho"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medLargo" placeholder="Largo"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medTiro" placeholder="Tiro"></div>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2" id="btnPostMedida">+ Cargar estas medidas</button>
            
            <div id="displayMedidasTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px;"></div>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-dark py-2" style="background: #b8922a; border: none; font-weight: 700;">GUARDAR ESTA VARIANTE</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
