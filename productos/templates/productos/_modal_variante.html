<div class="modal fade" id="modalVariante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: 15px; border: none; shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <div class="modal-header" style="background: #1a1612; color: #b8922a; border-radius: 15px 15px 0 0;">
        <h5 class="modal-title">Nueva Variante de Stock</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formVarianteInternal">
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">TALLE (opcional) <span class="char-limit">máx. 50</span></label>
            <input type="text" class="form-control char-input" id="inputTalleLibre" data-max="50" maxlength="50" placeholder="Ej: S, M, XL, 42, Unico... O Dejalo Vacio"
                   style="border-radius: 8px; border: 1.5px solid #e8dfd4; text-transform: capitalize;">
            <div class="char-counter"><span class="char-count">0</span>/50</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">COLORES Y STOCK <span class="char-limit">máx. 30</span></label>
            <div class="row g-2 mb-2">
              <div class="col-auto">
                <input type="color" class="form-control form-control-color" id="colorPickerModal" value="#000000" title="Elegir color"
                       style="width: 45px; height: 38px; padding: 2px; border-radius: 8px; cursor: pointer;">
              </div>
              <div class="col">
                <input type="text" class="form-control char-input" id="colorNombreModal" data-max="30" maxlength="30" placeholder="Nombre (Ej: Azul Marino)"
                       style="border: 1.5px solid #e8dfd4; border-radius: 8px;">
              </div>
              <div class="col-3">
                <input type="number" min="1" step="1" class="form-control" id="colorStockModal" placeholder="Stock"
                       style="border: 1.5px solid #e8dfd4; border-radius: 8px;"
                       onkeydown="return event.key !== 'e' && event.key !== 'E' && event.key !== '+' && event.key !== '-' && event.key !== '.'">
              </div>
              <div class="col-auto">
                <button type="button" class="btn btn-dark" id="btnPostColor" style="border-radius: 8px; height: 38px;">+</button>
              </div>
            </div>
            <div class="char-counter" style="margin-top: -0.4rem;"><span class="char-count">0</span>/30</div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="colorNingunoModal">
              <label class="form-check-label small" for="colorNingunoModal">No aplica color</label>
            </div>

            <div id="displayColoresTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px;"></div>

            <div class="mt-2 p-2 rounded" style="background: #f7f0e0; border: 1px solid #e8dfd4;">
              <div class="d-flex justify-content-between align-items-center">
                <span style="color: #8c7e70; font-size: 0.85rem; font-weight: 600;">Stock total de esta variante:</span>
                <span id="stockVarianteTotal" style="color: #b8922a; font-size: 1.1rem; font-weight: 700;">0</span>
              </div>
            </div>
            <input type="hidden" id="inputStockVariante" value="0">
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">MEDIDAS (cm)</label>
            <div class="row g-2 mb-2">
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAlto" placeholder="Alto"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAncho" placeholder="Ancho"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medLargo" placeholder="Largo"></div>
              <div class="col-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medTiro" placeholder="Tiro"></div>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2" id="btnPostMedida">+ Cargar estas medidas</button>
            
            <div id="displayMedidasTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px; max-height: 120px; overflow-y: auto;"></div>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn py-2" style="background: #1a1612; color: #fff; border: none; font-weight: 700; border-radius: 999px; transition: background 0.2s;" onmouseover="this.style.background='#b8922a'" onmouseout="this.style.background='#1a1612'">GUARDAR ESTA VARIANTE</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
