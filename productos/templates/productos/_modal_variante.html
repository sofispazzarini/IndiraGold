<style>
  /* Aviso dentro del formulario cuando el talle no tiene ningún color con stock (en vez del alert del navegador) */
  .aviso-variante {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    margin: 0 0 0.75rem;
    padding: 0.7rem 0.85rem;
    background: #fbf3f5;
    border: 1px solid rgba(110, 14, 46, 0.18);
    border-left: 3px solid #6E0E2E;
    border-radius: 10px;
    color: #6E0E2E;
    font-size: 0.85rem;
    line-height: 1.35;
    animation: avisoVarianteEntrada 0.2s ease-out;
  }
  .aviso-variante i { font-size: 1rem; line-height: 1.25; flex: 0 0 auto; }
  .aviso-variante small { display: block; color: #8c7e70; margin-top: 0.15rem; font-size: 0.78rem; }
  .seccion-con-aviso {
    border-radius: 12px;
    outline: 2px solid rgba(110, 14, 46, 0.25);
    outline-offset: 6px;
    transition: outline-color 0.2s;
  }
  @keyframes avisoVarianteEntrada {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .aviso-variante { animation: none; }
  }
</style>
<div class="modal fade" id="modalVariante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: 15px; border: none; shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <div class="modal-header" style="background: #1a1612; color: #b8922a; border-radius: 15px 15px 0 0;">
        <h5 class="modal-title">Nueva Variante de Stock</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formVarianteInternal">
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">TALLE (opcional) <span class="char-limit">máx. 20</span></label>
            <input type="text" class="form-control char-input" id="inputTalleLibre" data-max="20" maxlength="20" placeholder="Ej: S, M, XL, 42, Unico... O Dejalo Vacio"
                   style="border-radius: 8px; border: 1.5px solid #e8dfd4; text-transform: capitalize;">
            <div class="char-counter"><span class="char-count">0</span>/20</div>
          </div>

          <div class="mb-4" id="seccionColoresVariante">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">COLORES Y STOCK <span class="char-limit">máx. 30</span></label>
            <div id="avisoColoresVariante" class="aviso-variante d-none" role="alert">
              <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
              <div>
                <strong id="avisoColoresVarianteTexto"></strong>
                <small>Elegí el color (o marcá «No aplica color»), cargá el stock y tocá +.</small>
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-auto">
                <input type="color" class="form-control form-control-color" id="colorPickerModal" value="#000000" title="Elegir color"
                       style="width: 45px; height: 38px; padding: 2px; border-radius: 8px; cursor: pointer;">
              </div>
              <div class="col" style="min-width: 0;">
                <input type="text" class="form-control char-input" id="colorNombreModal" data-max="30" maxlength="30" placeholder="Nombre (Ej: Azul Marino)"
                       style="border: 1.5px solid #e8dfd4; border-radius: 8px;">
              </div>
              <!-- En pantallas chicas stock y "+" bajan a una segunda línea para que se lea el nombre -->
              <div class="w-100 d-sm-none"></div>
              <div class="col col-sm-3">
                <input type="number" min="1" step="1" class="form-control" id="colorStockModal" placeholder="Stock"
                       style="border: 1.5px solid #e8dfd4; border-radius: 8px;"
                       onkeydown="return event.key !== 'e' && event.key !== 'E' && event.key !== '+' && event.key !== '-' && event.key !== '.'">
              </div>
              <div class="col-auto">
                <button type="button" class="btn btn-dark" id="btnPostColor" style="border-radius: 8px; height: 38px;">+</button>
              </div>
            </div>
            <div class="char-counter" style="margin-top: -0.4rem;"><span class="char-count">0</span>/30</div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="colorNingunoModal">
              <label class="form-check-label small" for="colorNingunoModal">No aplica color</label>
            </div>

            <div id="displayColoresTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px;"></div>

            <div class="mt-2 p-2 rounded" style="background: #f7f0e0; border: 1px solid #e8dfd4;">
              <div class="d-flex justify-content-between align-items-center">
                <span style="color: #8c7e70; font-size: 0.85rem; font-weight: 600;">Stock total de esta variante:</span>
                <span id="stockVarianteTotal" style="color: #b8922a; font-size: 1.1rem; font-weight: 700;">0</span>
              </div>
            </div>
            <input type="hidden" id="inputStockVariante" value="0">
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold" style="color: #8c7e70; font-size: 0.8rem;">MEDIDAS (cm)</label>
            <div class="row g-2 mb-2">
              <div class="col-6 col-sm-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAlto" placeholder="Alto"></div>
              <div class="col-6 col-sm-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medAncho" placeholder="Ancho"></div>
              <div class="col-6 col-sm-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medLargo" placeholder="Largo"></div>
              <div class="col-6 col-sm-3"><input type="number" step="0.01" class="form-control form-control-sm" id="medTiro" placeholder="Tiro"></div>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2" id="btnPostMedida">+ Cargar estas medidas</button>
            
            <div id="displayMedidasTemp" class="p-2 border rounded bg-light d-none" style="min-height: 40px; max-height: 120px; overflow-y: auto;"></div>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn py-2" style="background: #1a1612; color: #fff; border: none; font-weight: 700; border-radius: 999px; transition: background 0.2s;" onmouseover="this.style.background='#b8922a'" onmouseout="this.style.background='#1a1612'">GUARDAR ESTA VARIANTE</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
