{% extends 'users/dashboard_admin.html' %}

{% block content %}

<div class="container mt-4" style="max-width: 900px;">
    <h2 class="mb-4">Agregar producto{% if subcategoria %} a la subcategoría: <span class="fw-bold">{{ subcategoria.nombre }}</span>{% endif %}</h2>
    
    <form id="formProducto" method="post">
        {% csrf_token %}
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="col-md-3">
                <label for="codigo" class="form-label">Código</label>
                <input type="text" class="form-control" id="codigo" name="codigo">
            </div>
            <div class="col-md-3">
                <label for="tipo" class="form-label">Tipo</label>
                <input type="text" class="form-control" id="tipo" name="tipo">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="precio" class="form-label">Precio base</label>
                <input type="number" class="form-control" id="precio" name="precio" min="0" step="0.01">
            </div>
            <div class="col-md-4">
                <label for="stock" class="form-label">Stock total</label>
                <input type="number" class="form-control" id="stock" name="stock" min="0">
            </div>
            <div class="col-md-4">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" class="form-control" id="descripcion" name="descripcion">
            </div>
        </div>

        <hr>

        <h4 class="mb-2">Talles, medidas y colores</h4>
        <div id="tallesContainer"></div>
        <button type="button" class="btn btn-gestion-bordo my-2" onclick="agregarTalle()">
            <span class="icono-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </span>
            Agregar talle
        </button>
        <div class="mt-3">
            <h5>Talles guardados</h5>
            <div id="listadoTalles"></div>
        </div>
        <input type="hidden" name="variantes_json" id="variantes_json">
        <div class="mt-4">
            <button type="submit" class="btn btn-gestion-bordo">Guardar producto</button>
        </div>
    </form>
</div>

<template id="tplTalle">
    <div class="card mb-3 talle-block" style="background:#faf8f6; border:1.5px solid #e0d6d0;">
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label mb-1" style="font-weight:600; color:#800020;">Nombre del talle</label>
                <input type="text" class="form-control talle-nombre" placeholder="Ej: S, M, L, 10, 12" required style="max-width:180px; background:#fff; border:1.5px solid #b8860b;">
            </div>
            <div class="medidasContainer"></div>
            <div class="mt-2" style="margin-left:2px;">
                <div class="listadoMedidas"></div>
            </div>
            <div class="d-flex flex-wrap gap-2 justify-content-end mt-3">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="agregarMedida(this)">Agregar medida</button>
                <button type="button" class="btn btn-success btn-sm" onclick="guardarTalle(this)">Guardar talle</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="eliminarTalle(this)">Eliminar talle</button>
            </div>
        </div>
    </div>
</template>
<template id="tplMedida">
    <div class="card mb-2 medida-block">
        <div class="card-body py-2 px-3">
            <div class="d-flex align-items-center mb-2 gap-2 flex-wrap">
                <input type="number" step="0.01" class="form-control form-control-sm medida-alto" placeholder="Alto" style="max-width:90px;">
                <input type="number" step="0.01" class="form-control form-control-sm medida-ancho" placeholder="Ancho" style="max-width:90px;">
                <input type="number" step="0.01" class="form-control form-control-sm medida-largo" placeholder="Largo" style="max-width:90px;">
                <input type="number" step="0.01" class="form-control form-control-sm medida-tiro" placeholder="Tiro" style="max-width:90px;">
                <button type="button" class="btn btn-success btn-sm" onclick="guardarMedida(this)">Guardar medida</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="eliminarMedida(this)">Eliminar medida</button>
            </div>
            <div class="coloresContainer"></div>
            <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="agregarColor(this)">Agregar color</button>
        </div>
    </div>
</template>
<template id="tplColor">
    <div class="input-group mb-1 color-block align-items-center" style="max-width:370px;">
        <input type="color" class="form-control form-control-color color-picker" style="width: 48px; height: 32px; padding: 2px; border: none; background: none;" value="#000000" title="Elegir color">
        <input type="text" class="form-control form-control-sm color-nombre ms-2" placeholder="Nombre del color" required style="max-width:120px;">
        <span class="color-preview ms-2" style="display:inline-block;width:28px;height:28px;border-radius:50%;border:1px solid #888;"></span>
        <div class="form-check ms-2">
            <input class="form-check-input color-ninguno" type="checkbox" id="colorNinguno" style="margin-top:0.5em;">
            <label class="form-check-label" for="colorNinguno" style="font-size:0.95em;">Ninguno</label>
        </div>
        <button type="button" class="btn btn-sm btn-danger ms-2" onclick="eliminarColor(this)">X</button>
    </div>
</template>

<style>
.btn-gestion-bordo {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #800020 0%, #b8860b 100%);
    color: #fff;
    font-size: 1.08rem;
    font-weight: 600;
    border: none;
    border-radius: 28px;
    box-shadow: 0 2px 12px rgba(128,0,32,0.10);
    padding: 14px 28px;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    cursor: pointer;
    min-width: 180px;
    max-width: 240px;
    min-height: 48px;
    justify-content: center;
    width: auto;
    box-sizing: border-box;
    text-decoration: none;
    margin-right: 8px;
}
.btn-gestion-bordo:hover {
    background: linear-gradient(90deg, #b8860b 0%, #800020 100%);
    box-shadow: 0 4px 18px rgba(128,0,32,0.18);
    transform: translateY(-2px) scale(1.04);
    color: #fff;
    text-decoration: none;
}
.icono-btn {
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>

<script>
// Manejar opción 'Ninguno' para color
document.addEventListener('change', function(e) {
    if (e.target.classList.contains('color-ninguno')) {
        const block = e.target.closest('.color-block');
        const picker = block.querySelector('.color-picker');
        const nombre = block.querySelector('.color-nombre');
        const preview = block.querySelector('.color-preview');
        if (e.target.checked) {
            picker.disabled = true;
            nombre.disabled = true;
            preview.style.background = '#eee';
            nombre.value = 'Sin color';
        } else {
            picker.disabled = false;
            nombre.disabled = false;
            preview.style.background = picker.value;
            nombre.value = '';
        }
    }
});
// Diccionario simple de nombres de colores estándar
const COLOR_NAMES = {
    '#000000': 'Negro', '#ffffff': 'Blanco', '#ff0000': 'Rojo', '#00ff00': 'Verde', '#0000ff': 'Azul',
    '#ffff00': 'Amarillo', '#00ffff': 'Cian', '#ff00ff': 'Magenta', '#808080': 'Gris', '#800000': 'Bordó',
    '#008000': 'Verde oscuro', '#000080': 'Azul oscuro', '#ffa500': 'Naranja', '#a52a2a': 'Marrón', '#ffc0cb': 'Rosa'
};

// Al agregar color, inicializar eventos
document.addEventListener('input', function(e) {
    if (e.target.classList.contains('color-picker')) {
        const colorInput = e.target;
        const colorBlock = colorInput.closest('.color-block');
        const nombreInput = colorBlock.querySelector('.color-nombre');
        const colorPreview = colorBlock.querySelector('.color-preview');
        colorPreview.style.background = colorInput.value;
        // Si el nombre está vacío o coincide con el anterior, autocompletar
        if (!nombreInput.value || COLOR_NAMES[colorInput.value.toLowerCase()]) {
            nombreInput.value = COLOR_NAMES[colorInput.value.toLowerCase()] || colorInput.value;
        }
    }
});
document.addEventListener('DOMContentLoaded', function() {
    // Inicializar previews para los ya existentes
    document.querySelectorAll('.color-block').forEach(function(block) {
        const picker = block.querySelector('.color-picker');
        const preview = block.querySelector('.color-preview');
        if (picker && preview) preview.style.background = picker.value;
    });
});

// Guardar medida y mostrar en listado
function guardarMedida(btn) {
    const medidaDiv = btn.closest('.medida-block');
    let alto = medidaDiv.querySelector('.medida-alto').value;
    let ancho = medidaDiv.querySelector('.medida-ancho').value;
    let largo = medidaDiv.querySelector('.medida-largo').value;
    let tiro = medidaDiv.querySelector('.medida-tiro').value;
    if (!alto && !ancho && !largo && !tiro) {
        alert('Debe ingresar al menos un valor para la medida.');
        return;
    }
    let coloresArr = [];
    medidaDiv.querySelectorAll('.color-block').forEach(function(colorDiv) {
        const ninguno = colorDiv.querySelector('.color-ninguno')?.checked;
        if (ninguno) {
            coloresArr.push({ nombre: 'Sin color', color: null, ninguno: true });
        } else {
            coloresArr.push({
                nombre: colorDiv.querySelector('.color-nombre').value.trim(),
                color: colorDiv.querySelector('.color-picker').value,
                ninguno: false
            });
        }
    });
    // Guardar en listado visual
    const listado = medidaDiv.closest('.talle-block').querySelector('.listadoMedidas');
    let idx = Date.now() + Math.floor(Math.random()*10000); // id único
    let html = `<div class='d-flex align-items-center mb-1' data-medida-idx='${idx}'>` +
        `<span class='badge bg-secondary me-2'>A:${alto||'-'} An:${ancho||'-'} L:${largo||'-'} T:${tiro||'-'}` +
        (coloresArr.length ? ' | Colores: ' + coloresArr.map(c=>c.nombre).join(', ') : '') +
        `</span>` +
        `<button type='button' class='btn btn-sm btn-danger ms-2' onclick='eliminarMedidaGuardada(this)'>X</button></div>`;
    listado.innerHTML += html;
    // Guardar datos en el div para serializar luego
    if (!listado._medidas) listado._medidas = [];
    listado._medidas.push({idx, alto, ancho, largo, tiro, colores: coloresArr});
    // Limpiar inputs
    medidaDiv.querySelector('.medida-alto').value = '';
    medidaDiv.querySelector('.medida-ancho').value = '';
    medidaDiv.querySelector('.medida-largo').value = '';
    medidaDiv.querySelector('.medida-tiro').value = '';
    medidaDiv.querySelectorAll('.color-block').forEach(cb => cb.remove());
}

function eliminarMedidaGuardada(btn) {
    const div = btn.closest('[data-medida-idx]');
    const listado = btn.closest('.listadoMedidas');
    let idx = parseInt(div.getAttribute('data-medida-idx'));
    if (listado._medidas) {
        listado._medidas = listado._medidas.filter(m => m.idx !== idx);
    }
    div.remove();
}


// Listado de talles guardados
let tallesGuardados = [];

function agregarTalle() {
    const tpl = document.getElementById('tplTalle').content.cloneNode(true);
    document.getElementById('tallesContainer').appendChild(tpl);
}
function eliminarTalle(btn) {
    btn.closest('.talle-block').remove();
}
function agregarMedida(btn) {
    const medidasContainer = btn.closest('.talle-block').querySelector('.medidasContainer');
    // Si ya hay una medida sin guardar (inputs visibles), no permitir agregar otra
    if (medidasContainer.querySelector('.medida-block input:not([disabled])')) {
        mostrarModalMedida();
        return;
    }
    const tpl = document.getElementById('tplMedida').content.cloneNode(true);
    medidasContainer.appendChild(tpl);
    // Modal Bootstrap para advertencia de medida no guardada
    function mostrarModalMedida() {
        let modal = document.getElementById('modalMedidaNoGuardada');
        if (!modal) {
            modal = document.createElement('div');
            modal.className = 'modal fade';
            modal.id = 'modalMedidaNoGuardada';
            modal.tabIndex = -1;
            modal.innerHTML = `
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Atención</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p>Debe guardar o eliminar la medida actual antes de agregar una nueva.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                    </div>
                </div>
            </div>`;
            document.body.appendChild(modal);
        }
        var bsModal = new bootstrap.Modal(modal);
        bsModal.show();
    }
    // Al guardar, deshabilitar los inputs y botones de la medida guardada
    const medidaDiv = btn.closest('.medida-block');
    medidaDiv.querySelectorAll('input').forEach(inp => inp.disabled = true);
    medidaDiv.querySelectorAll('button').forEach(b => b.disabled = true);
}
function eliminarMedida(btn) {
    btn.closest('.medida-block').remove();
}
function agregarColor(btn) {
    const tpl = document.getElementById('tplColor').content.cloneNode(true);
    btn.closest('.medida-block').querySelector('.coloresContainer').appendChild(tpl);
}
function eliminarColor(btn) {
    btn.closest('.color-block').remove();
}

function guardarTalle(btn) {
    const talleDiv = btn.closest('.talle-block');
    let nombreTalle = talleDiv.querySelector('.talle-nombre').value.trim();
    if (!nombreTalle) {
        alert('El talle debe tener nombre.');
        return;
    }
    let medidasArr = [];
    // Solo las medidas guardadas
    const listado = talleDiv.querySelector('.listadoMedidas');
    if (listado && listado._medidas) {
        medidasArr = listado._medidas;
    }
    tallesGuardados.push({nombre: nombreTalle, medidas: medidasArr});
    actualizarListadoTalles();
    talleDiv.remove();
}

function actualizarListadoTalles() {
    let cont = document.getElementById('listadoTalles');
    cont.innerHTML = '';
    tallesGuardados.forEach(function(talle, idx) {
        let html = `<div class='d-flex align-items-center mb-2'><strong class='me-2'>Talle: ${talle.nombre}</strong>`;
        if (talle.medidas.length) {
            html += `<span class='me-2'>Medidas:</span>`;
            talle.medidas.forEach(function(medida) {
                html += `<span class='badge bg-secondary me-1'>A:${medida.alto||'-'} An:${medida.ancho||'-'} L:${medida.largo||'-'} T:${medida.tiro||'-'}`;
                if (medida.colores.length) {
                    html += ' | ' + medida.colores.map(c =>
                        c.ninguno ?
                        `<span style='display:inline-block;text-align:center;margin:0 2px;'>
                            <span title='Sin color' style='display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;border:1px solid #888;background:#eee;'></span><br>
                            <span style='font-size:0.75em;line-height:1;'>Sin color</span>
                        </span>` :
                        `<span style='display:inline-block;text-align:center;margin:0 2px;'>
                            <span title='${c.nombre||c.color||""}' style='display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;border:1px solid #888;background:${c.color||c.nombre||'#000'}'></span><br>
                            <span style='font-size:0.75em;line-height:1;'>${c.nombre||''}</span>
                        </span>`
                    ).join('');
                }
                html += `</span>`;
            });
        }
        html += `<button type='button' class='btn btn-sm btn-danger ms-2' onclick='eliminarTalleGuardado(${idx})'>X</button></div>`;
        cont.innerHTML += html;
    });
}

function eliminarTalleGuardado(idx) {
    tallesGuardados.splice(idx, 1);
    actualizarListadoTalles();
}

// Serializar solo los talles guardados
document.getElementById('formProducto').addEventListener('submit', function(e) {
    document.getElementById('variantes_json').value = JSON.stringify(tallesGuardados);
});
</script>
{% endblock %}

<script>
// Listas temporales para mostrar colores y medidas
let colores = [];
let medidas = [];

// Botón agregar color
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('btnAgregarColor').addEventListener('click', function() {
        document.getElementById('color_nombre').value = '';
        document.getElementById('colorNinguno').checked = false;
        var modal = new bootstrap.Modal(document.getElementById('modalColores'));
        modal.show();
    });
    document.getElementById('formColores').addEventListener('submit', function(e) {
        e.preventDefault();
        let colorNinguno = document.getElementById('colorNinguno').checked;
        let color = colorNinguno ? 'Ninguno' : document.getElementById('color_nombre').value.trim();
        if (color && !colores.includes(color)) {
            colores.push(color);
            actualizarListadoColores();
        }
        bootstrap.Modal.getInstance(document.getElementById('modalColores')).hide();
    });
    // Botón agregar medida (modal)
    document.getElementById('formMedidas').addEventListener('submit', function(e) {
        e.preventDefault();
        let nombre = document.getElementById('medida_nombre').value.trim();
        let valor = document.getElementById('medida_valor').value.trim();
        let unidad = document.getElementById('medida_unidad').value.trim();
        if (nombre && valor && unidad) {
            medidas.push({nombre, valor, unidad});
            actualizarListadoMedidas();
        }
        bootstrap.Modal.getInstance(document.getElementById('modalMedidas')).hide();
        document.getElementById('formMedidas').reset();
    });
});

function actualizarListadoColores() {
    let cont = document.getElementById('listadoColores');
    cont.innerHTML = colores.map(c => `<span class='badge bg-primary me-1 mb-1'>${c}</span>`).join('');
}
function actualizarListadoMedidas() {
    let cont = document.getElementById('listadoMedidas');
    cont.innerHTML = medidas.map(m => `<span class='badge bg-secondary me-1 mb-1'>${m.nombre}: ${m.valor} ${m.unidad}</span>`).join('');
}

// Variantes
let variantes = [];
// Abrir modal variante
document.addEventListener('DOMContentLoaded', function() {
    if(document.getElementById('btnAgregarVariante')){
        document.getElementById('btnAgregarVariante').addEventListener('click', function() {
            // Reset modal
            document.getElementById('variante_talle').value = '';
            document.getElementById('variante_color_picker').value = '#000000';
            document.getElementById('variante_color_nombre').value = '';
            document.getElementById('variante_color_ninguno').checked = false;
            document.getElementById('variante_alto').value = '';
            document.getElementById('variante_ancho').value = '';
            document.getElementById('variante_largo').value = '';
            document.getElementById('variante_tiro').value = '';
            document.getElementById('variante_stock').value = '';
            document.getElementById('variante_precio').value = '';
            var modal = new bootstrap.Modal(document.getElementById('modalVariante'));
            modal.show();
        });
    }
    // Guardar variante
    if(document.getElementById('formVariante')){
        document.getElementById('formVariante').addEventListener('submit', function(e) {
            e.preventDefault();
            let talle = document.getElementById('variante_talle').value;
            let colorNinguno = document.getElementById('variante_color_ninguno').checked;
            let colorHex = colorNinguno ? null : document.getElementById('variante_color_picker').value;
            let colorNombre = colorNinguno ? 'Sin color' : document.getElementById('variante_color_nombre').value.trim();
            let alto = document.getElementById('variante_alto').value;
            let ancho = document.getElementById('variante_ancho').value;
            let largo = document.getElementById('variante_largo').value;
            let tiro = document.getElementById('variante_tiro').value;
            let stock = document.getElementById('variante_stock').value;
            let precio = document.getElementById('variante_precio').value;
            if(talle && stock && precio) {
                variantes.push({
                    talle, colorHex, colorNombre, alto, ancho, largo, tiro, stock, precio
                });
                actualizarListadoVariantes();
                bootstrap.Modal.getInstance(document.getElementById('modalVariante')).hide();
            }
        });
    }
});

function actualizarListadoVariantes() {
    let cont = document.getElementById('listadoVariantes');
    if(!cont) return;
    cont.innerHTML = variantes.map(v => `
        <div class='d-flex align-items-center mb-1' style='font-size:0.95em;'>
            <span class='badge bg-light text-dark border me-1'>Talle: ${v.talle}</span>
            ${v.colores && v.colores.length ? v.colores.map(c => c.colorNinguno ? `<span class='badge bg-secondary me-1 mb-1'>Sin color</span>` : `<span class='badge bg-primary me-1 mb-1'><span style='display:inline-block;width:14px;height:14px;border-radius:50%;background:${c.colorHex};border:1px solid #888;margin-right:4px;'></span>${c.colorNombre}</span>`).join('') : ''}
            ${v.medidas && v.medidas.length ? v.medidas.map(m => `<span class='badge bg-secondary me-1 mb-1'>${['Alto: '+m.alto, 'Ancho: '+m.ancho, 'Largo: '+m.largo, 'Tiro: '+m.tiro].filter(x=>!x.endsWith(': ')).join(' / ')}</span>`).join('') : ''}
            <span class='badge bg-success me-1'>Stock: ${v.stock}</span>
            <span class='badge bg-info text-dark'>Precio: $${v.precio}</span>
        </div>
    `).join('');
}
// Serializar variantes antes de enviar el formulario
document.getElementById('formProducto').addEventListener('submit', function(e) {
    document.getElementById('variantes_json').value = JSON.stringify(variantes);
});
</script>
