{% extends 'users/dashboard_admin.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 p-4 mx-auto" style="max-width: 650px; border-radius: 20px;">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h3 class="fw-bold text-dark mb-0" style="font-family: 'Cormorant Garamond';">
                Agregar Talle a: <span style="color: #b8922a;">{{ producto.nombre }}</span>
            </h3>
            <a href="{% url 'productos:editar_producto' producto.id %}" class="btn btn-sm btn-outline-secondary rounded-pill">← Volver</a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="row g-4">

                <div class="col-md-6">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Talle (Letra / Numero)</label>
                    <input type="text" name="talle_nombre" class="form-control" value="{{ previo.talle_nombre|default:'' }}" placeholder="Ej: S, M, XL, 42, Unico..." style="text-transform: capitalize;" required>
                </div>

                <div class="col-md-6">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Stock de este talle</label>
                    <input type="number" name="stock" id="stockTalleInput" class="form-control" value="{{ previo.stock|default:'0' }}" min="0" placeholder="0">
                    <small class="text-muted" id="stockTalleAyuda"></small>
                </div>

                <div class="col-12">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Colores</label>
                    <div class="input-group mb-2">
                        <input type="color" class="form-control form-control-color" id="colorPicker" value="#000000"
                               style="max-width: 50px; height: 38px; padding: 2px; cursor: pointer;">
                        <input type="text" class="form-control" id="colorNombreInput" placeholder="Nombre del color (Ej: Rojo, Azul Marino)">
                        <button type="button" class="btn btn-dark" id="btnAgregarColor">+</button>
                    </div>
                    <div id="contenedorColores" class="d-flex flex-wrap gap-2 p-2 border rounded bg-light" style="min-height: 40px;">
                        <span class="text-muted small" id="msgSinColores">No hay colores cargados</span>
                    </div>
                </div>

                <div class="col-12">
                    <label class="small fw-bold text-muted text-uppercase mb-2">Medidas en CM</label>
                    <div id="contenedorMedidas" style="max-height: 250px; overflow-y: auto;">
                        <p class="text-muted small" id="msgSinMedidas">No hay medidas cargadas</p>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="agregarMedida()">+ Agregar medida</button>
                </div>

            </div>

            <div class="mt-4 pt-4 border-top d-flex justify-content-end gap-2">
                <a href="{% url 'productos:editar_producto' producto.id %}" class="btn btn-light rounded-pill px-4">Cancelar</a>
                <button type="submit" class="btn btn-dark px-5 rounded-pill shadow-sm" style="background: #1a1612; border: none;">Agregar Talle</button>
            </div>
        </form>

    </div>
</div>

<style>
    .form-control, .form-select { border-radius: 12px; border: 1px solid #eee; background-color: #fafafa; }
    .form-control:focus, .form-select:focus { border-color: #b8922a; box-shadow: none; background-color: #fff; }
    .input-group-text { border: 1px solid #eee; font-size: 0.75rem; font-weight: bold; background: #f8f8f8; }
    .medida-row { border: 1px solid #e8dfd4 !important; }
    .form-control-color { border-radius: 12px 0 0 12px !important; }
    #btnAgregarColor { border-radius: 0 12px 12px 0 !important; }
</style>

{% if previo %}{{ previo|json_script:'talle-previo' }}{% endif %}
<script>
document.getElementById('btnAgregarColor').addEventListener('click', function() {
    const colorHex = document.getElementById('colorPicker').value;
    const colorNombre = document.getElementById('colorNombreInput').value.trim() || colorHex;
    // Escapado para el HTML: un nombre con comillas no corta el valor del input
    const colorNombreHtml = colorNombre.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const contenedor = document.getElementById('contenedorColores');

    const msgVacio = document.getElementById('msgSinColores');
    if (msgVacio) msgVacio.remove();

    const html = `
        <span class="color-chip d-inline-flex align-items-center gap-1 px-2 py-1 rounded" style="background: #333;" title="${colorNombreHtml}">
            <span style="display:inline-block; width:20px; height:20px; background-color:${colorHex}; border-radius:50%; border:2px solid #fff;"></span>
            <span class="text-white small">${colorNombreHtml}</span>
            <input type="hidden" name="colores" value="${colorNombreHtml}|${colorHex}">
            <input type="number" name="stock_color" class="form-control form-control-sm stock-color-input" value="0" min="0" style="width:64px; padding:2px 6px;" title="Stock de este color" oninput="recalcularStockTalle()">
            <button type="button" class="btn-close btn-close-white ms-1" style="font-size:0.4rem" onclick="this.parentElement.remove(); recalcularStockTalle()"></button>
        </span>
    `;
    contenedor.insertAdjacentHTML('beforeend', html);
    document.getElementById('colorNombreInput').value = '';
    recalcularStockTalle();
});

// Con colores, el stock del talle es la suma del stock de cada color
function recalcularStockTalle() {
    const inputs = document.querySelectorAll('#contenedorColores .stock-color-input');
    const stockTalle = document.getElementById('stockTalleInput');
    const ayuda = document.getElementById('stockTalleAyuda');
    if (inputs.length) {
        let total = 0;
        inputs.forEach(i => { total += Math.max(0, parseInt(i.value || '0', 10) || 0); });
        stockTalle.value = total;
        stockTalle.readOnly = true;
        ayuda.textContent = 'Se calcula sumando el stock de cada color.';
    } else {
        stockTalle.readOnly = false;
        ayuda.textContent = '';
    }
}
document.addEventListener('DOMContentLoaded', recalcularStockTalle);

// Si el talle estaba repetido, se vuelven a cargar los colores y medidas que se habían ingresado
{% if previo %}
document.addEventListener('DOMContentLoaded', function() {
    const previo = JSON.parse(document.getElementById('talle-previo').textContent);
    (previo.colores || []).forEach(color => {
        document.getElementById('colorPicker').value = color.hex && color.hex.length === 7 ? color.hex : '#000000';
        document.getElementById('colorNombreInput').value = color.nombre;
        document.getElementById('btnAgregarColor').click();
        const stocks = document.querySelectorAll('#contenedorColores .stock-color-input');
        stocks[stocks.length - 1].value = color.stock;
    });
    (previo.medidas || []).forEach(medida => {
        agregarMedida();
        const fila = [...document.querySelectorAll('#contenedorMedidas .medida-row')].pop();
        ['alto', 'ancho', 'largo', 'tiro'].forEach(campo => { fila.querySelector(`[name="${campo}"]`).value = medida[campo]; });
    });
    recalcularStockTalle();
});
{% endif %}

function agregarMedida() {
    const contenedor = document.getElementById('contenedorMedidas');
    const msgVacio = document.getElementById('msgSinMedidas');
    if (msgVacio) msgVacio.remove();

    const html = `
        <div class="medida-row mb-2 p-2 border rounded bg-light">
            <input type="hidden" name="medida_id" value="">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white text-muted">A</span>
                        <input type="number" step="0.01" name="alto" class="form-control" placeholder="Alto">
                    </div>
                </div>
                <div class="col">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white text-muted">An</span>
                        <input type="number" step="0.01" name="ancho" class="form-control" placeholder="Ancho">
                    </div>
                </div>
                <div class="col">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white text-muted">L</span>
                        <input type="number" step="0.01" name="largo" class="form-control" placeholder="Largo">
                    </div>
                </div>
                <div class="col">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white text-muted">T</span>
                        <input type="number" step="0.01" name="tiro" class="form-control" placeholder="Tiro">
                    </div>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.medida-row').remove()" title="Eliminar">x</button>
                </div>
            </div>
        </div>
    `;
    contenedor.insertAdjacentHTML('beforeend', html);
    contenedor.scrollTop = contenedor.scrollHeight;
}
</script>

{% endblock %}
